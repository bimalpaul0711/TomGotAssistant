fun startListening() {
    speechRecognizer = SpeechRecognizer.createSpeechRecognizer(this)
    val intent = Intent(RecognizerIntent.ACTION_RECOGNIZE_SPEECH).apply {
        putExtra(RecognizerIntent.EXTRA_LANGUAGE_MODEL, RecognizerIntent.LANGUAGE_MODEL_FREE_FORM)
        
        // यहाँ "hi-IN" सेट करने से ऐप हिंदी और अंग्रेजी दोनों मिक्स्ड शब्दों को समझ लेगा
        putExtra(RecognizerIntent.EXTRA_LANGUAGE, "hi-IN")
        putExtra(RecognizerIntent.EXTRA_LANGUAGE_PREFERENCE, "hi-IN")
        putExtra(RecognizerIntent.EXTRA_ONLY_RETURN_LANGUAGE_PREFERENCE, true)
    }

    speechRecognizer.setRecognitionListener(object : RecognitionListener {
        override fun onReadyForSpeech(params: Bundle?) {}
        override fun onBeginningOfSpeech() {}
        override fun onRmsChanged(rmsdB: Float) {}
        override fun onBufferReceived(buffer: ByteArray?) {}
        override fun onEndOfSpeech() {}
        override fun onError(error: Int) {}
        
        override fun onResults(results: Bundle?) {
            val matches = results?.getStringArrayList(SpeechRecognizer.RESULTS_RECOGNITION)
            if (!matches.isNullOrEmpty()) {
                val spokenText = matches[0]
                // यूजर ने हिंदी या अंग्रेजी में जो भी बोला, वह यहाँ प्रोसेस होगा
                processCommand(spokenText)
            }
        }
        override fun onPartialResults(partialResults: Bundle?) {}
        override fun onEvent(eventType: Int, params: Bundle?) {}
    })

    speechRecognizer.startListening(intent)
}
private fun processCommand(command: String) {
    val text = command.lowercase()
    when {
        // अगर यूजर 'whatsapp' या 'व्हाट्सएप' कुछ भी बोले
        text.contains("whatsapp") || text.contains("व्हाट्सएप") -> {
            openApp("com.whatsapp", this)
        }
        
        // अगर यूजर 'settings' या 'सेटिंग्स' बोले
        text.contains("settings") || text.contains("सेटिंग्स") -> {
            val intent = Intent(android.provider.Settings.ACTION_SETTINGS)
            intent.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)
            startActivity(intent)
        }
        
        // अगर यूजर 'time' या 'समय' या 'टाइम' पूछे
        text.contains("time") || text.contains("समय") || text.contains("टाइम") -> {
            val currentTime = java.text.SimpleDateFormat("hh:mm a", Locale.getDefault()).format(java.util.Date())
            Toast.makeText(this, "अभी समय $currentTime हुआ है", Toast.LENGTH_LONG).show()
        }
        
        else -> {
            Toast.makeText(this, "माफ़ कीजिए, मैं समझ नहीं पाई: $text", Toast.LENGTH_SHORT).show()
        }
    }
}
