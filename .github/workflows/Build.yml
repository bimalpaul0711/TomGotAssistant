override fun onAccessibilityEvent(event: AccessibilityEvent?) {
    val nodeInfo = event?.source ?: return
    
    // स्क्रीन पर "Answer" या "Receive" बटन ढूंढकर उसपर क्लिक करना
    for (i in 0 until nodeInfo.childCount) {
        val child = nodeInfo.getChild(i) ?: continue
        val text = child.text?.toString()?.lowercase() ?: ""
        if (text.contains("answer") || text.contains("accept") || text.contains("उठाओ")) {
            child.performAction(AccessibilityNodeInfo.ACTION_CLICK)
            speakOut("कॉल रिसीव कर ली गई है")
            break
        }
    }
}fun typeAndSearch(searchQuery: String) {
    val rootNode = rootInActiveWindow ?: return
    
    // स्क्रीन पर सर्च बार (EditText) ढूंढना
    for (i in 0 until rootNode.childCount) {
        val node = rootNode.getChild(i)
        if (node?.className?.toString()?.contains("EditText") == true) {
            // ऑटोमैटिक टेक्स्ट टाइप करना
            val arguments = Bundle().apply {
                putCharSequence(AccessibilityNodeInfo.ACTION_ARGUMENT_SET_TEXT_CHARSEQUENCE, searchQuery)
            }
            node.performAction(AccessibilityNodeInfo.ACTION_SET_TEXT, arguments)
            
            // कीबोर्ड का 'Search' या 'Enter' बटन दबाना
            node.performAction(AccessibilityNodeInfo.ACTION_NEXT_AT_MOVEMENT_GRANULARITY)
            break
        }
    }
}        // कॉल करने के लिए
