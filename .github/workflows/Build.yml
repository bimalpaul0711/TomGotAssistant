package com.example.systemcontroller // अपनी फाइल के हिसाब से पैकेज नेम बदलें

import android.content.Context
import android.content.Intent
import android.os.Bundle
import android.widget.Button
import android.widget.EditText
import android.widget.Toast
import androidx.appcompat.app.AppCompatActivity

class MainActivity : AppCompatActivity() {
    override fun onCreate(savedInstanceState: Bundle?) {
        super.onCreate(savedInstanceState)
        setContentView(R.layout.activity_main)

        val editText = findViewById<EditText>(R.id.commandInput)
        val button = findViewById<Button>(R.id.submitButton)

        button.setOnClickListener {
            val userCommand = editText.text.toString()
            processCommand(userCommand)
        }
    }

    private fun processCommand(command: String) {
        val lowerCommand = command.lowercase()
        when {
            lowerCommand.contains("whatsapp") -> {
                openApp("com.whatsapp", this)
            }
            lowerCommand.contains("settings") -> {
                val intent = Intent(android.provider.Settings.ACTION_SETTINGS)
                intent.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)
                startActivity(intent)
            }
            else -> {
                Toast.makeText(this, "Command match nahi hui", Toast.LENGTH_SHORT).show()
            }
        }
    }

    private fun openApp(packageName: String, context: Context) {
        val intent = context.packageManager.getLaunchIntentForPackage(packageName)
        if (intent != null) {
            intent.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)
            context.startActivity(intent)
        } else {
            Toast.makeText(context, "App install nahi hai", Toast.LENGTH_SHORT).show()
        }
    }
}
import android.speech.RecognitionListener
import android.speech.RecognizerIntent
import android.speech.SpeechRecognizer
import android.content.Intent
import java.util.Locale

// MainActivity के अंदर इस फंक्शन को सेटअप करें
private lateinit var speechRecognizer: SpeechRecognizer

fun startListening() {
    speechRecognizer = SpeechRecognizer.createSpeechRecognizer(this)
    val intent = Intent(RecognizerIntent.ACTION_RECOGNIZE_SPEECH).apply {
        putExtra(RecognizerIntent.EXTRA_LANGUAGE_MODEL, RecognizerIntent.LANGUAGE_MODEL_FREE_FORM)
        putExtra(RecognizerIntent.EXTRA_LANGUAGE, Locale.getDefault().toString())
    }

    speechRecognizer.setRecognitionListener(object : RecognitionListener {
        override fun onReadyForSpeech(params: Bundle?) {}
        override fun onBeginningOfSpeech() {}
        override fun onRmsChanged(rmsdB: Float) {}
        override fun onBufferReceived(buffer: ByteArray?) {}
        override fun onEndOfSpeech() {}
        override fun onError(error: Int) {}
        
        override fun onResults(results: Bundle?) {
            val matches = results?.getStringArrayList(SpeechRecognizer.RESULTS_RECOGNITION)
            if (!matches.isNullOrEmpty()) {
                val spokenText = matches[0]
                // यहाँ यूज़र द्वारा बोली गई बात प्रोसेस होगी
                processCommand(spokenText)
            }
        }
        override fun onPartialResults(partialResults: Bundle?) {}
        override fun eventful(eventType: Int, params: Bundle?) {}
    })

    speechRecognizer.startListening(intent)
}
private fun processCommand(command: String) {
    val text = command.lowercase()
    when {
        text.contains("whatsapp") || text.contains("व्हाट्सएप") -> {
            openApp("com.whatsapp", this)
        }
        text.contains("time") || text.contains("समय") || text.contains("टाइम") -> {
            val currentTime = java.text.SimpleDateFormat("hh:mm a", Locale.getDefault()).format(java.util.Date())
            Toast.makeText(this, "अभी समय $currentTime हुआ है", Toast.LENGTH_LONG).show()
        }
        text.contains("settings") || text.contains("सेटिंग्स") -> {
            val intent = Intent(android.provider.Settings.ACTION_SETTINGS)
            intent.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)
            startActivity(intent)
        }
        else -> {
            Toast.makeText(this, "माफ़ कीजिए, मैं यह समझ नहीं पाई: $text", Toast.LENGTH_SHORT).show()
        }
    }
}
