fun toggleFlashlight(turnOn: Boolean) {
    val cameraManager = getSystemService(Context.CAMERA_SERVICE) as android.hardware.camera2.CameraManager
    try {
        val cameraId = cameraManager.cameraIdList[0]
        if (android.os.Build.VERSION.SDK_INT >= android.os.Build.VERSION_CODES.M) {
            cameraManager.setTorchMode(cameraId, turnOn)
            if (turnOn) speakOut("टॉर्च ऑन कर दी गई है") else speakOut("टॉर्च बंद कर दी गई है")
        }
    } catch (e: Exception) {
        Toast.makeText(this, "फ्लैशलाइट में दिक्कत है", Toast.LENGTH_SHORT).show()
    }
}

cleanCommand.contains("flashlight on") || cleanCommand.contains("टॉर्च जलाओ") -> {
    toggleFlashlight(true)
}
cleanCommand.contains("flashlight off") || cleanCommand.contains("टॉर्च बुझाओ") -> {
    toggleFlashlight(false)
}

fun setAlarm(hour: Int, minute: Int, message: String) {
    val intent = android.content.Intent(android.provider.AlarmClock.ACTION_SET_ALARM).apply {
        putExtra(android.provider.AlarmClock.EXTRA_MESSAGE, message)
        putExtra(android.provider.AlarmClock.EXTRA_HOUR, hour)
        putExtra(android.provider.AlarmClock.EXTRA_MINUTES, minute)
        putExtra(android.provider.AlarmClock.EXTRA_SKIP_UI, true) // बिना ऐप खोले डायरेक्ट सेट हो जाएगा
        addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)
    }
    startActivity(intent)
    speakOut("अलार्म सेट कर दिया गया है")
}

