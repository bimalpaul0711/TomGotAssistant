import android.speech.tts.TextToSpeech
import java.util.Locale

class MainActivity : AppCompatActivity(), TextToSpeech.OnInitListener {
    
    private lateinit var tts: TextToSpeech

    override fun onCreate(savedInstanceState: Bundle?) {
        super.onCreate(savedInstanceState)
        setContentView(R.layout.activity_main)

        // TextToSpeech को इनिशियलाइज करें
        tts = TextToSpeech(this, this)

        // बाकी पुराना कोड (बटन क्लिक, स्पीच रिकग्निशन आदि) यहाँ रहेगा...
    }

    override fun onInit(status: Int) {
        if (status == TextToSpeech.SUCCESS) {
            // भाषा हिंदी सेट करें ताकि यह हिंदी में बोल सके
            val result = tts.setLanguage(Locale("hi", "IN"))
            if (result == TextToSpeech.LANG_MISSING_DATA || result == TextToSpeech.LANG_NOT_SUPPORTED) {
                // अगर हिंदी सपोर्ट नहीं है तो डिफ़ॉल्ट भाषा ले लेगा
            }
        }
    }

    // बोलने वाला फंक्शन
    private fun speakOut(text: String) {
        tts.speak(text, TextToSpeech.QUEUE_FLUSH, null, null)
    }

    override fun onDestroy() {
        // ऐप बंद होने पर TTS को रिलीज़ करना ज़रूरी है
        if (::tts.isInitialized) {
            tts.stop()
            tts.shutdown()
        }
        super.onDestroy()
    }
}
